id: asks-for-required-inputs
title: With no output folder or glossary named, the skill asks once and writes nothing
description: |
  Covers "Required inputs": the gap-analysis folder and the glossary are project-specific, so the skill asks once at
  the start for whichever is missing and confirms the path explicitly rather than guessing or inferring it.

  The prompt names the workflow and both source files but neither the output folder nor a glossary. The workspace holds
  a decoy, an empty docs/gap-analysis/ folder, so writing a report there would be the guess the skill forbids. The
  script judge checks the workspace and the final reply: no HTML anywhere (the engine's dot-directories are ignored),
  nothing in the decoy folder, and one reply that asks for the folder and for the glossary.

input:
  prompt: |
    Use the gap-analysis skill for this request.

    Do a gap analysis on the returns authorisation workflow: compare docs/returns/returns-authorisation.bpmn against
    docs/returns/requirements.md and give me the HTML report.

context:
  repo_fixture: evals/fixtures/repos/returns

constraints:
  timeout_seconds: 240
  max_turns: 10

judge:
  type: script
  script_path: evals/fixtures/scripts/judge_asks_inputs.py
  timeout_seconds: 30
