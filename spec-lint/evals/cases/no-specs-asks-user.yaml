id: no-specs-asks-user
title: Asks where the specs live instead of inventing a location when no profile matches
description: |
  Covers Step 1.3 rule 3: "No match → ask the user where specs live. Do not
  invent a location."

  The repo has source code and a README that never names a spec root, and none
  of the seven profile signals is present. Passing means asking; failing means
  creating a spec tree, a `meta/` directory, or a lint report out of thin air.
  The judge checks both halves — the question in the reply, and the absence of
  fabricated directories on disk.

input:
  prompt: |
    Run a spec lint over this repo.

context:
  files:
    "README.md": |
      # Ledger

      A small double-entry ledger library.

      ## Install

      `pip install ledger`

    "src/ledger/__init__.py": |
      from .account import Account

      __all__ = ["Account"]

    "src/ledger/account.py": |
      class Account:
          def __init__(self, name: str) -> None:
              self.name = name
              self.balance = 0

          def credit(self, amount: int) -> None:
              self.balance += amount

    "tests/test_account.py": |
      from ledger import Account


      def test_credit():
          a = Account("cash")
          a.credit(10)
          assert a.balance == 10

judge:
  type: script
  script_path: evals/fixtures/scripts/assert-asks-for-spec-root.sh
  timeout_seconds: 30
