id: requirements-ears-draft
title: Drafts requirements.md in EARS form under docs/specs and stops before design
description: |
  Stage 2 plus the approval gate. The skill must write
  `docs/specs/{feature-name}/requirements.md` (kebab-case directory) with an
  Introduction, a User Story per requirement, and Acceptance Criteria phrased
  in EARS — WHEN / WHERE / IF-THEN / THE SYSTEM SHALL. It must also "Present it
  and ask if it looks good" and "Only advance to the next stage after explicit
  approval", so design.md and tasks.md must not appear.

  The prompt closes Stage 1 explicitly — the goal, the rejection cases, and the
  scope boundary are all stated — so a run that stalls asking more questions
  has no document to grade, which is the failure this case catches. The judge
  reads the file, not the reply, because the reply may only summarise it.

input:
  prompt: |
    Use the spec-coding skill for this request.
    We already agreed the goal, so skip the clarifying questions and go straight
    to the requirements document for spec-driven development.

    Feature: discount codes at checkout. A customer types a code at checkout and
    gets a percentage off the order total. Each code has an expiry date and a
    usage cap. A code that is unknown, expired, or past its cap has to be
    refused with a message the customer can act on, and only one code may apply
    to an order. Every applied code gets recorded for finance to reconcile.
    Admin screens for creating codes are out of scope.

context:
  files:
    "README.md": |
      # Orders

      A small order-taking service. Orders are held in memory; checkout turns an
      order into an amount due.

    "src/orders.py": |
      # SENTINEL-ORDERS-BODY
      ORDERS: dict[str, dict] = {}


      def create_order(order_id: str, items: list[dict]) -> dict:
          total = sum(item["price"] * item["qty"] for item in items)
          order = {"id": order_id, "items": items, "total": total}
          ORDERS[order_id] = order
          return order


      def get_order(order_id: str) -> dict | None:
          return ORDERS.get(order_id)

    "src/checkout.py": |
      from .orders import get_order


      def checkout(order_id: str) -> dict:
          order = get_order(order_id)
          if order is None:
              raise KeyError(order_id)
          return {"order_id": order_id, "amount_due": order["total"]}

    "tests/test_orders.py": |
      from src.orders import create_order, get_order


      def test_total_is_summed():
          order = create_order("o1", [{"price": 300, "qty": 2}])
          assert order["total"] == 600
          assert get_order("o1") == order

judge:
  type: script
  script_path: evals/fixtures/scripts/assert-requirements-draft.sh
  timeout_seconds: 30
