id: goal-confirmation-first
title: Asks clarifying questions instead of writing spec documents from a vague goal
description: |
  Stage 1: "Establish a clear, shared understanding of what the feature should
  accomplish before generating any documents", asking about the problem and
  whom it is for, expected behaviour, technical constraints, and scope
  boundaries.

  The prompt is a one-line feature wish. Who the notifications are for, what
  triggers them, which channel they use, and what is out of scope are all
  missing — every Stage 1 topic is unanswered. Passing means the reply asks;
  failing means requirements.md, design.md, or tasks.md lands on disk from a
  goal the user never confirmed, or that implementation starts outright.

input:
  prompt: |
    Use the spec-coding skill for this request.
    I want to use spec-driven development to add notifications to this app.

context:
  files:
    "README.md": |
      # Orders

      A small order-taking service. Orders are held in memory; checkout turns an
      order into an amount due.

    "src/orders.py": |
      # SENTINEL-ORDERS-BODY
      ORDERS: dict[str, dict] = {}


      def create_order(order_id: str, items: list[dict]) -> dict:
          total = sum(item["price"] * item["qty"] for item in items)
          order = {"id": order_id, "items": items, "total": total}
          ORDERS[order_id] = order
          return order


      def get_order(order_id: str) -> dict | None:
          return ORDERS.get(order_id)

    "src/checkout.py": |
      from .orders import get_order


      def checkout(order_id: str) -> dict:
          order = get_order(order_id)
          if order is None:
              raise KeyError(order_id)
          return {"order_id": order_id, "amount_due": order["total"]}

    "tests/test_orders.py": |
      from src.orders import create_order, get_order


      def test_total_is_summed():
          order = create_order("o1", [{"price": 300, "qty": 2}])
          assert order["total"] == 600
          assert get_order("o1") == order

judge:
  type: script
  script_path: evals/fixtures/scripts/assert-goal-confirmation.sh
  timeout_seconds: 30
