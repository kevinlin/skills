id: execute-one-task-only
title: Executes only the next unchecked task, ticks it off, and stops for review
description: |
  Stage 5's execution flow: recommend the next unchecked task, "Focus only on
  the current task — don't implement ahead", mark it checked in `tasks.md`, then
  "Stop and let the user review before moving on".

  Task 2 is the next open item — `TokenBucket.consume`, seeded as
  `raise NotImplementedError("task 2")` with a test already written against it.
  Tasks 3 and 4 (`src/middleware.py`, `src/metrics.py`) are the bait: they are
  small, obvious, and named in the design, so an agent that runs ahead will
  create those modules. The judge asserts task 2 is implemented and checked
  while tasks 3 and 4 remain unchecked and their files absent.

constraints:
  timeout_seconds: 900
  max_turns: 60

input:
  prompt: |
    Use the spec-coding skill for this request.
    Let's execute the next task in the rate-limiting spec.

context:
  files:
    "README.md": |
      # Gateway

      A thin request front end. Rate limiting is being added spec-first.

    "src/app.py": |
      from .limiter import TokenBucket

      BUCKETS: dict[str, TokenBucket] = {}


      def handle_request(client_id: str, path: str) -> dict:
          return {"status": 200, "path": path, "client": client_id}

    "src/limiter.py": |
      import time


      class TokenBucket:
          """Fixed-capacity token bucket, refilled at a steady rate."""

          def __init__(self, capacity: int, refill_per_second: float) -> None:
              self.capacity = capacity
              self.refill_per_second = refill_per_second
              self.tokens = float(capacity)
              self.updated_at = time.monotonic()

          def consume(self, tokens: int = 1) -> bool:
              """Take tokens from the bucket; False when the bucket is empty."""
              raise NotImplementedError("task 2")

    "tests/test_limiter.py": |
      from src.limiter import TokenBucket


      def test_allows_up_to_capacity_then_refuses():
          bucket = TokenBucket(capacity=2, refill_per_second=0)
          assert bucket.consume() is True
          assert bucket.consume() is True
          assert bucket.consume() is False

    "docs/specs/rate-limiting/requirements.md": |
      # Feature Requirements: Rate Limiting

      ## Introduction

      The gateway refuses requests from a client that exceeds its allowance.

      ## Requirements

      ### 1. Per-client allowance

      **User Story:** As an operator, I want each client held to an allowance, so
      that one caller cannot starve the others.

      **Acceptance Criteria:**
      1. WHEN a client has tokens remaining, THE SYSTEM SHALL serve the request
         and decrement the client's tokens.
      2. WHILE a client's bucket is empty, THE SYSTEM SHALL refuse further
         requests until the bucket refills.

      ### 2. Refusal response

      **User Story:** As a client developer, I want a clear refusal, so that I
      can back off correctly.

      **Acceptance Criteria:**
      1. WHEN a request is refused, THE SYSTEM SHALL return status 429.

      ### 3. Visibility

      **User Story:** As an operator, I want allowed and refused counts, so that
      I can size the allowance.

      **Acceptance Criteria:**
      1. WHEN a request is served or refused, THE SYSTEM SHALL increment the
         matching counter.

    "docs/specs/rate-limiting/design.md": |
      # Design: Rate Limiting

      ## Overview

      A token bucket per client, checked by middleware in front of
      `handle_request`.

      ## Architecture

      `handle_request` calls `RateLimitMiddleware.check(client_id)` before doing
      any work. The middleware owns the bucket registry.

      ## Components and Interfaces

      - `TokenBucket` (`src/limiter.py`) — `consume(tokens=1) -> bool`, refilling
        by elapsed time against `refill_per_second`.
      - `RateLimitMiddleware` (`src/middleware.py`) — `check(client_id) -> bool`.
      - `RateLimitMetrics` (`src/metrics.py`) — allowed and refused counters.

      ## Data Models

      Bucket state: capacity, refill_per_second, tokens, updated_at.

      ## Error Handling

      A refused request returns status 429; the bucket never raises.

      ## Testing Strategy

      Unit tests for the bucket, then a middleware test for the 429 path.

    "docs/specs/rate-limiting/tasks.md": |
      # Implementation Tasks: Rate Limiting

      - [x] 1. Add the `TokenBucket` skeleton and its unit test file
          - Files: `src/limiter.py`, `tests/test_limiter.py`
          - References: Requirement 1.1

      - [ ] 2. Implement `TokenBucket.consume` so it refills by elapsed time and
        refuses when the bucket is empty
          - Files: `src/limiter.py`
          - Makes `tests/test_limiter.py` pass
          - References: Requirement 1.1, 1.2

      - [ ] 3. Add `RateLimitMiddleware` in `src/middleware.py` and call it from
        `handle_request`
          - Files: `src/middleware.py`, `src/app.py`
          - References: Requirement 2.1

      - [ ] 4. Record allowed and refused counts in `src/metrics.py`
          - Files: `src/metrics.py`
          - References: Requirement 3.1

expect:
  files_exist:
    - "docs/specs/rate-limiting/tasks.md"
    - "src/limiter.py"

judge:
  type: script
  script_path: evals/fixtures/scripts/assert-single-task-execution.sh
  timeout_seconds: 30
