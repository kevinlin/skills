schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/strip-not-x-but-y.yaml
    - evals/cases/report-scan-and-changelog.yaml
    - evals/cases/preserve-facts-no-invention.yaml
    - evals/cases/reddit-register.yaml
    - evals/cases/academic-no-overcorrection.yaml
  defaults:
    timeout_seconds: 300
    max_turns: 12

report:
  formats: [json]
