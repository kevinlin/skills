version: 2
rules:
  - id: E2
    path: tests/test_diarize.py
    reason: "Test isolation, not harvesting: line 11 deletes only MOSS_* vars so a
      developer's real MOSS setup cannot leak into the checks; line 36 snapshots
      os.environ only to restore it after a block. Nothing is logged or sent
      anywhere."
  - id: AST4
    path: scripts/diarize.py
    reason: Every subprocess.run uses an argv list with shell=False and a fixed
      executable (ffmpeg, ffprobe, the MOSS venv's mtd-subtitle/python); the
      remediation the rule asks for is already in place.
  - id: TT2
    path: scripts/diarize.py
    reason: The env sources are the documented operator config (MOSS_VENV,
      MOSS_MODEL, MOSS_DEVICE, MOSS_VLLM_URL) set by the same user who runs the
      script; values go into argv lists (no shell), and line 220 write_md writes
      a path the script builds itself, not one from the environment.
  - id: AST4
    path: tests/test_check_recap.py
    reason: Test runs check_recap.py via sys.executable with an argv list and
      temp-dir paths it created; no shell, no external input.
  - id: AST4
    path: tests/test_diarize.py
    reason: Test runs ffmpeg (to synthesise a sine fixture) and diarize.py -h via
      argv lists with no shell; all arguments are literals or temp paths it
      created.
  - id: LP1
    path: evals/fixtures/judge_common.py
    reason: The only 'network' capability is 'from urllib.parse import unquote',
      which decodes %-escapes in link targets; the module opens no socket or
      URL.
